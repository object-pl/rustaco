<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rustaco diff editor</title>
  <style>html, body { margin: 0; height: 100%; background: #1e1e1e; } #root { position: absolute; inset: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { createDiffEditor } from './diff.js';
    const original = `fn main() {
    let total = add(1, 2);
    println!("{total}");
}

fn add(a: i32, b: i32) -> i32 {
    a + b
}
`;
    const modified = `fn main() {
    let total = add(1, 2) * 2;
    println!("total = {total}");
    println!("done");
}

fn add(a: i32, b: i32) -> i32 {
    a + b
}
`;
    const inline = new URLSearchParams(location.search).has('inline');
    window.diff = await createDiffEditor(document.getElementById('root'), { original, modified, language: 'rust', inline });
  </script>
</body>
</html>
