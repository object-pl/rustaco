<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico">
  <meta charset="utf-8">
  <title>Rustaco</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; }
    #root { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { createEditor, setTheme } from './rustaco.js';
    import { styleId } from './pkg/rustaco_web.js';
    window.rustacoSetTheme = setTheme;
    window.rustacoStyleId = styleId;

    const sample = `// Rustaco demo
use std::collections::HashMap;

fn main() {
\tlet mut counts: HashMap<&str, usize> = HashMap::new();
\tfor word in "the quick brown fox jumps over the lazy dog".split_whitespace() {
\t\t*counts.entry(word).or_default() += 1;
\t}
\tprintln!("{counts:?} 😀 中文");
}
` + Array.from({ length: 5000 }, (_, i) => `// filler line ${i + 1}`).join('\n');

    const editor = await createEditor(document.getElementById("root"), {
      value: sample, language: 'rust',
      // ?text=canvas draws the text on the canvas instead of with WebGL.
      textLayer: new URLSearchParams(location.search).get('text') ?? 'webgl',
    });
    editor.focus();
    window.editor = editor;
  </script>
</body>
</html>
