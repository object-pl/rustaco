[package]
name = "rustaco-web"
description = "Browser frontend for the Rustaco editor: WASM, canvas rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustaco-core.workspace = true
rustaco-view.workspace = true
rustaco-syntax = { workspace = true, default-features = false }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics"] }
