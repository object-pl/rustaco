[package]
name = "rustaco-syntax-wasm"
description = "Language module for the Rustaco browser editor: tree-sitter parsing and highlighting in WASM"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustaco-core.workspace = true
rustaco-syntax = { workspace = true, default-features = false }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"

# One feature per language; scripts/build-web.sh builds one module per language pack.
[features]
# Internal: the tree-sitter engine; enabled by every tree-sitter language below.
tree-sitter = ["rustaco-syntax/engine"]
# SQL, Kotlin and Dockerfile through the TextMate engine (the browser has no SQL grammar module).
textmate = ["rustaco-syntax/textmate"]
rust = ["tree-sitter", "rustaco-syntax/rust"]
javascript = ["tree-sitter", "rustaco-syntax/javascript"]
typescript = ["tree-sitter", "rustaco-syntax/typescript"]
json = ["tree-sitter", "rustaco-syntax/json"]
python = ["tree-sitter", "rustaco-syntax/python"]
c = ["tree-sitter", "rustaco-syntax/c"]
cpp = ["tree-sitter", "rustaco-syntax/cpp"]
go = ["tree-sitter", "rustaco-syntax/go"]
java = ["tree-sitter", "rustaco-syntax/java"]
csharp = ["tree-sitter", "rustaco-syntax/csharp"]
# Packs carry the languages they inject: scripts and styles in HTML, front matter in Markdown.
html = ["tree-sitter", "rustaco-syntax/html", "rustaco-syntax/css", "rustaco-syntax/javascript"]
css = ["tree-sitter", "rustaco-syntax/css"]
bash = ["tree-sitter", "rustaco-syntax/bash"]
toml = ["tree-sitter", "rustaco-syntax/toml"]
yaml = ["tree-sitter", "rustaco-syntax/yaml"]
sql = ["tree-sitter", "rustaco-syntax/sql"]
markdown = ["tree-sitter", "rustaco-syntax/markdown", "rustaco-syntax/yaml", "rustaco-syntax/html"]
