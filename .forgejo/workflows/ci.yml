# Forgejo Actions (GitHub Actions syntax). Copy to .github/workflows to run on GitHub.
name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: docker
    container: rust:1
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang llvm
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Tools
        run: cargo install --locked wasm-bindgen-cli@0.2.130 cargo-deny
      - name: Checks
        run: ./scripts/ci.sh

  e2e:
    runs-on: docker
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang llvm
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target wasm32-unknown-unknown
          . "$HOME/.cargo/env"
          cargo install --locked wasm-bindgen-cli@0.2.130
          ./scripts/build-web.sh
      - name: Browser tests
        run: cd tests/e2e && npm ci && npx playwright test

  fuzz:
    runs-on: docker
    container: rustlang/rust:nightly
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz for five minutes
        run: |
          cargo install --locked cargo-fuzz
          cd fuzz && cargo fuzz run document_ops -- -max_total_time=300
