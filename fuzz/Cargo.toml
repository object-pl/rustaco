[package]
name = "rustaco-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
rustaco-core = { path = "../crates/rustaco-core" }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "document_ops"
path = "fuzz_targets/document_ops.rs"
test = false
doc = false
bench = false
