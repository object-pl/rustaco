<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>html, body { margin: 0; height: 100%; } #root { position: absolute; inset: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'node_modules/monaco-editor/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      const editor = monaco.editor.create(document.getElementById('root'), {
        value: '', language: 'rust', theme: 'vs-dark', fontSize: 14, minimap: { enabled: false }, automaticLayout: true,
      });
      window.bench = {
        name: 'monaco',
        async load(text) {
          const t = performance.now();
          editor.setValue(text);
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
          return performance.now() - t;
        },
        setCaret(offset) {
          const p = editor.getModel().getPositionAt(offset);
          editor.setPosition(p);
          editor.revealPositionInCenter(p);
          editor.focus();
        },
        value() { return editor.getValue(); },
        scrollBy(dy) { editor.setScrollTop(editor.getScrollTop() + dy); },
      };
      window.benchReady = true;
    });
  </script>
</body>
</html>
